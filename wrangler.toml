# 挪车二维码 · Cloudflare Workers 配置
#
# 首次部署：
#   1. npx wrangler d1 create chezai-qrcode        ← 把输出的 database_id 粘到下面
#   2. npx wrangler d1 execute chezai-qrcode --remote --file=./schema.sql
#   3. npx wrangler secret put ADMIN_PASSWORD
#   4. npx wrangler secret put SESSION_SECRET      ← 随便一串长随机字符串
#   5. npx wrangler deploy
#   6. 拿到 <名字>.<账号>.workers.dev 后填进 PUBLIC_BASE_URL，再 deploy 一次

name = "chezai-qrcode"
main = "src/worker.js"
compatibility_date = "2024-09-23"

# public/ 下的 style.css 与 app.js 由 Cloudflare 边缘直接托管。
# 这里显式给了 binding，所以 Worker 一定先跑，未命中路由的请求再由 Worker 转交给 ASSETS，
# 行为不依赖「静态资源优先还是 Worker 优先」的默认值。
[assets]
directory = "./public"
binding = "ASSETS"

[vars]
# 二维码里写死的域名。留空则按请求的 Host 动态生成 —— 换域名后旧贴纸会失效，
# 所以正式使用一定要填成你的正式域名（workers.dev 或自定义域）。
PUBLIC_BASE_URL = ""
# 页面时间显示的时区偏移（小时）
TZ_OFFSET_HOURS = "8"

[[d1_databases]]
binding = "DB"
database_name = "chezai-qrcode"
database_id = "把 wrangler d1 create 输出的 database_id 粘到这里"
